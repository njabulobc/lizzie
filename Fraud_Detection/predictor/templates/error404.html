{% extends "base.html" %}

{% block page_heading %}Page not found{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl text-center">
    <div class="rounded-3xl border border-slate-800/70 bg-slate-900/80 p-10 shadow-2xl shadow-slate-950/50">
        <span class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-rose-500/10 text-rose-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M12 9v4m0 4h.01M4.293 17.293 12 3l7.707 14.293A1 1 0 0 1 18.804 19H5.196a1 1 0 0 1-.903-1.707Z" />
            </svg>
        </span>
        <h2 class="mt-6 text-3xl font-semibold text-white">Error {{ error_code }}</h2>
        <p class="mt-3 text-sm text-slate-400">{{ error_message }}. The resource you are looking for might have been moved or is temporarily unavailable.</p>
        <a href="{% url 'home' %}" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-emerald-500 px-5 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-emerald-500/40 transition hover:bg-emerald-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="m15 19-7-7 7-7" />
            </svg>
            Return to dashboard
        </a>
    </div>
</div>
{% endblock %}
